name: Build Mod Menu iOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Bu satır sayesinde Actions sekmesinden manuel "Run" diyebilirsin.

jobs:
  build:
    runs-on: macos-latest # iOS derlemesi için Mac sunucusu şart

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          submodules: recursive # KittyMemory gibi alt modülleri de indirir

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          # iOS 14.5 SDK genelde en stabil olanıdır, onu indiriyoruz
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/*.sdk $THEOS/sdks
          rm -r master.zip sdks-master

      - name: Setup Theos Jailed (Opsiyonel ama iyi olur)
        run: |
          git clone https://github.com/kabiroberai/theos-jailed.git $THEOS/vendor/lib/theos-jailed

      - name: Compile (Build)
        run: |
          # Hata verirse durmasın diye -k eklemiyorum ama loglara bakman lazım
          make package FINALPACKAGE=1

      - name: Upload Artifact (.deb Dosyası)
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu_CriticalOps
          path: ./packages/*.deb
