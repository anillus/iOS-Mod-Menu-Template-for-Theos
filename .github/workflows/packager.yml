name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Theos Kurulumu
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: SDK İndir (iOS 26.0.1)
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p ~/theos/sdks
          mv sdks-master/iPhoneOS14.5.sdk ~/theos/sdks/
          rm -r sdks-master master.zip

      - name: Derle (Make Package)
        run: |
          make package FINALPACKAGE=1
          
      - name: Dosyayı Yükle (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: CriticalCheats_Dylib
          path: packages/*.deb
